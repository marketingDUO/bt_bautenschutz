name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testlauf: nur anzeigen, was sich ändern würde (nichts hochladen/löschen)"
        type: boolean
        default: true

permissions:
  contents: read

# Nie zwei Deployments gleichzeitig; ein laufendes wird nicht abgebrochen.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.HETZNER_HOST }}
      FTP_USER: ${{ secrets.HETZNER_USER }}
      LFTP_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      # Zielordner relativ zum FTP-Login-Verzeichnis. Änderbar über die
      # Repository-Variable DEPLOY_PATH (Settings → Variables → Actions).
      TARGET: ${{ vars.DEPLOY_PATH || '.' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Website prüfen (validate.mjs)
        run: node validate.mjs

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTPS-Verbindung vorbereiten
        run: |
          # Nur verschlüsseltes FTP (FTPS, explizites TLS) mit Zertifikatsprüfung.
          # cmd:fail-exit: jeder fehlgeschlagene Befehl bricht lftp mit Fehlercode ab.
          # Passwort kommt aus LFTP_PASSWORD (--env-password), nicht aus der Datei.
          cat > "$RUNNER_TEMP/connect.lftp" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u "$FTP_USER" -p 21 "ftp://$HOST"
          EOF

      - name: Sicherheitsprüfung Zielordner
        run: |
          # Erlaubt ist nur: Ordner trägt unsere Markierung (frühere Deployments)
          # oder ist leer (abgesehen von Server-Standarddateien).
          # Verbindungs- oder Lesefehler lassen diesen Schritt fehlschlagen.
          { cat "$RUNNER_TEMP/connect.lftp"
            printf 'mkdir -p -f "%s"\ncd "%s"\ncls -1a\nbye\n' "$TARGET" "$TARGET"
          } > "$RUNNER_TEMP/check.lftp"
          RAW=$(lftp -f "$RUNNER_TEMP/check.lftp")
          ENTRIES=$(printf '%s\n' "$RAW" | sed 's:/$::' | grep -vxE '\.|\.\.|' || true)
          echo "Einträge im Zielordner: $(printf '%s' "$ENTRIES" | grep -c . || true)"
          if echo "$ENTRIES" | grep -qx '\.bt-deploy'; then
            echo "Zielordner-Status: bisheriges Deployment-Ziel"
          elif [ -z "$(echo "$ENTRIES" | grep -vxE '\.well-known|\.htaccess|\.user\.ini|\.ftpquota' || true)" ]; then
            echo "Zielordner-Status: leer"
          else
            echo "$ENTRIES"
            echo "::error::Zielordner enthält fremde Dateien und ist kein bisheriges Deployment-Ziel. Abbruch, damit nichts gelöscht wird. DEPLOY_PATH prüfen."
            exit 1
          fi

      - name: Dateien per FTPS übertragen (Spiegeln)
        run: |
          touch dist/.bt-deploy   # Markierung für die Sicherheitsprüfung
          # --overwrite: geänderte Dateien direkt ersetzen statt erst löschen
          # (sonst wären Seiten während des Uploads kurz nicht erreichbar).
          # --delete entfernt nur Dateien, die es in dist/ nicht mehr gibt.
          OPTS="--reverse --delete --overwrite --verbose --no-perms --parallel=4"
          if [ "$DRY_RUN" = "true" ]; then
            OPTS="$OPTS --dry-run"
            echo "TESTLAUF – es wird nichts verändert"
          fi
          { cat "$RUNNER_TEMP/connect.lftp"
            printf '%s\n' "mirror $OPTS -x '^\.well-known/' -x '^\.htaccess\$' -x '^\.user\.ini\$' -x '^\.ftpquota\$' dist/ \"$TARGET\""
            echo bye
          } > "$RUNNER_TEMP/deploy.lftp"
          lftp -f "$RUNNER_TEMP/deploy.lftp"
