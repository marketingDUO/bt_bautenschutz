name: Check deployment configuration
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Hetzner directories without changing files
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USERNAME: ${{ secrets.HETZNER_USER }}
          PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          TARGET: ${{ secrets.HETZNER_TARGET_DIR || secrets.HETZNER_PATH || secrets.HETZNER_REMOTE_PATH }}
        run: |
          python - <<'PY'
          import os,ftplib,ssl
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect(os.environ['HOST'],21)
          ftp.login(os.environ['USERNAME'],os.environ['PASSWORD'])
          ftp.prot_p()
          print("Encrypted FTP connection successful")
          print("Target configured:",bool(os.environ['TARGET']))
          print("Root entries:",ftp.nlst())
          if os.environ['TARGET']:
              ftp.cwd(os.environ['TARGET'])
              print("Configured target entries:",ftp.nlst())
          else:
              try:
                  ftp.cwd('public_html')
                  print("public_html entries:",ftp.nlst())
              except ftplib.error_perm:
                  pass
          ftp.quit()
          PY
