name: Check deployment configuration
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required FTP settings without exposing values
        env:
          FTP_SERVER_SET: ${{ secrets.FTP_SERVER != '' }}
          FTP_HOST_SET: ${{ secrets.FTP_HOST != '' }}
          FTP_USERNAME_SET: ${{ secrets.FTP_USERNAME != '' }}
          FTP_USER_SET: ${{ secrets.FTP_USER != '' }}
          FTP_PASSWORD_SET: ${{ secrets.FTP_PASSWORD != '' }}
          FTP_SERVER_DIR_SET: ${{ secrets.FTP_SERVER_DIR != '' }}
          FTP_TARGET_DIR_SET: ${{ secrets.FTP_TARGET_DIR != '' }}
          HETZNER_HOST_SET: ${{ secrets.HETZNER_HOST != '' }}
          HETZNER_USER_SET: ${{ secrets.HETZNER_USER != '' }}
          HETZNER_PASSWORD_SET: ${{ secrets.HETZNER_PASSWORD != '' }}
        run: python -c 'import os; print("\n".join(k + "=" + v for k,v in sorted(os.environ.items()) if k.endswith("_SET")))'
